{% extends "base.html" %}
{% load static %}

{% block title %}Cerrar Sesión{% endblock %}

{% block content %}

    <h4 class="alert-heading">Sesión finalizada</h4>
    <p>Has cerrado sesión exitosamente. ¡Hasta pronto!</p>

    </a>
  </div>
</div>
{% endblock %}
